name: Veklom Gate release

# Publishes ghcr.io/<owner>/veklom-gate when a tag like gate-v0.2.0 is pushed.
on:
  push:
    tags:
      - "gate-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VEKLOM_MCP_ACCESS_TOKEN: ci-inbound-token-not-production
      VEKLOM_MCP_ENVIRONMENT: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e './mcp_server[dev]'
      - run: pytest -q mcp_server/tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veklom-gate
          tags: |
            type=match,pattern=gate-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/gate-v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: mcp_server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
