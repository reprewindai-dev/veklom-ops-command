<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veklom Ops Command</title><style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#121720;--line:#26303d;--text:#eef3f8;--muted:#8d9aaa;--accent:#66e3c4;--warn:#ffca6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173132 0,#0b0e13 36%);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700}.h1{font-size:34px;letter-spacing:-.04em;margin:5px 0}.muted{color:var(--muted)}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#10151d;border-radius:999px;padding:7px 11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:rgba(18,23,32,.88);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 12px 35px #0002}.team{min-height:145px}.team h3{margin:0 0 7px;font-size:16px}.status{color:var(--warn);font-size:12px}.compose{margin-top:18px;display:grid;grid-template-columns:1fr 180px;gap:12px}.compose textarea{grid-column:1/-1;min-height:110px;resize:vertical}.compose select,.compose textarea,.compose button{font:inherit;color:var(--text);background:#0d1219;border:1px solid var(--line);border-radius:10px;padding:12px}.compose button{background:var(--accent);color:#07120f;border:0;font-weight:800;cursor:pointer}.compose button:hover{filter:brightness(1.08)}.section{margin-top:22px}.section h2{font-size:15px;margin:0 0 10px}.message{border-left:3px solid var(--accent);padding:10px 12px;background:#0f151d;margin:8px 0}.ok{color:var(--accent)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){main{padding:18px}.top{display:block}.grid{grid-template-columns:1fr}.compose{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><div class="eyebrow">Private founder control desk</div><div class="h1">Veklom Ops Command</div><div class="muted">Poltergeist-powered departments watching the build surface.</div></div><div id="meta" class="meta"></div></div><section class="card"><div class="section"><h2>Send an instruction to Command Desk</h2><div class="muted">Messages are queued in the repo inbox. Production-impacting work remains approval-gated.</div><div class="compose"><textarea id="text" placeholder="Example: inspect Core Backend 4 for protocol drift. Do not deploy or modify production."></textarea><select id="risk"><option value="low">Low risk</option><option value="medium" selected>Medium risk</option><option value="high">High risk</option><option value="critical">Critical</option></select><button id="send">Queue instruction</button></div><div id="result" class="muted"></div></div></section><section class="section"><h2>Departments</h2><div id="teams" class="grid"></div></section><section class="section"><h2>Operator feed</h2><div id="feed" class="card"><div class="muted">No new messages in this session.</div></div></section></main><script>
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(s){$('meta').innerHTML=`<span class="pill">v${esc(s.version)}</span><span class="pill">${esc(s.branch)} @ ${esc(s.commit)}</span><span class="pill ${s.dirty?'':'ok'}">${s.dirty?'uncommitted changes':'source clean'}</span>`;$('teams').innerHTML=s.teams.map(t=>`<article class="card team"><h3>${esc(t.team)}</h3><div class="muted">${esc(t.mission)}</div><p class="status">${t.targetCount} watcher target · ${esc(t.watcher)}</p><small class="muted">${t.reports.length?esc(t.reports.join(', ')):'No reports yet'}</small></article>`).join('')}async function refresh(){const r=await fetch('/api/state');render(await r.json())}refresh();const events=new EventSource('/api/events');events.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='message'){$('feed').innerHTML=`<div class="message"><b>Queued to Command Desk</b><br>${esc(d.record.text)}<br><small class="muted">${esc(d.record.createdAt)} · ${esc(d.record.risk)} · approval required</small></div>`+$('feed').innerHTML}else refresh()};$('send').onclick=async()=>{const text=$('text').value.trim();if(!text)return;$('send').disabled=true;const r=await fetch('/api/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,risk:$('risk').value,requiresApproval:true})});const d=await r.json();$('result').textContent=r.ok?'Instruction queued in reports/command-desk-inbox.jsonl':d.error||'Unable to queue';if(r.ok)$('text').value='';$('send').disabled=false};
</script></body></html>
